name: Branch reconciliation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    paths:
      - "branch-dispositions.json"
      - "BRANCH_RECONCILIATION.md"
      - "scripts/check-branch-dispositions.py"
      - ".github/workflows/branch-reconciliation.yml"
  push:
    branches:
      - main
    paths:
      - "branch-dispositions.json"
      - "BRANCH_RECONCILIATION.md"
      - "scripts/check-branch-dispositions.py"
      - ".github/workflows/branch-reconciliation.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every remote branch
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Record open PR heads and bases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr list --state open --limit 100 --json number,headRefName,baseRefName > "$RUNNER_TEMP/open-prs.json"

      - name: Enforce branch dispositions
        run: python3 scripts/check-branch-dispositions.py --open-prs "$RUNNER_TEMP/open-prs.json"
