name: Prune proven-contained branches

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PRUNE_CONTAINED
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".control-plane/PRUNE_CONTAINED_BRANCHES_20260911"

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    if: github.event_name == 'push' || inputs.confirm == 'PRUNE_CONTAINED'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build guarded prune plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          gh pr list --state open --limit 100 --json number,headRefName,baseRefName,updatedAt,isDraft > /tmp/open-prs.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          reg = json.loads(Path("branch-dispositions.json").read_text())
          disp = reg["dispositions"]
          prs = json.loads(Path("/tmp/open-prs.json").read_text())
          protected = {x for p in prs for x in (p.get("headRefName"), p.get("baseRefName")) if x}
          branches = {x.strip() for x in subprocess.run(["git","for-each-ref","--format=%(refname:strip=3)","refs/remotes/origin"],check=True,text=True,stdout=subprocess.PIPE).stdout.splitlines() if x.strip() not in {"","HEAD","main"}}
          allow_cleanup = {"ops/branch-reconciliation-20260910"}
          candidates, errors = [], []
          for b in sorted(branches):
              r = disp.get(b)
              status = r.get("status") if isinstance(r, dict) else None
              if b in protected:
                  continue
              if isinstance(r, dict) and r.get("protect_reason"):
                  continue
              if status == "CONTAINED" or b in allow_cleanup:
                  ok = subprocess.run(["git","merge-base","--is-ancestor",f"origin/{b}","origin/main"],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode == 0
                  if ok: candidates.append(b)
                  else: errors.append(f"{b}: not contained in main")
              elif status is None:
                  errors.append(f"{b}: unregistered and not protected")
          if errors:
              print("\n".join(errors)); raise SystemExit("Refusing to prune unexpected branch state")
          Path("/tmp/candidates.txt").write_text("\n".join(candidates) + ("\n" if candidates else ""))
          print(f"Candidates: {len(candidates)}")
          for b in candidates: print(f"- {b}")
          PY

      - name: Delete only proven-contained refs
        run: |
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            echo "Deleting $branch"
            git push origin --delete "$branch"
          done < /tmp/candidates.txt

      - name: Verify candidate refs are gone
        run: |
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then exit 1; fi
          done < /tmp/candidates.txt
          echo "Prune verification passed."
